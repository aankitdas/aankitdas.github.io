            url: https://github.com/CMB-ML/
          # - icon: fab fa-twitter
          #   url: https://twitter.com/intent/tweet?text=Check+it+out:&url=https%3A%2F%2Fgithub.com%2Fgurusabarish%2Fhugo-profile

      - title: SecureVision - Raspberry Pi Biometric Authentication System
        content: Developed an advanced facial recognition security system using Raspberry Pi, integrating computer vision techniques
                with AWS cloud services to capture, log, and alert on unauthorized access attempts, demonstrating expertise in IoT,
                machine learning, and cloud infrastructure.
        image: /projects/secure.jpg
        featured:
          name: Demo
          link: https://github.com/aankitdas/SecureVision/blob/main/demo.mp4
        badges:
          - "Raspberry Pi"
          - "Computer Vision"
          - "AWS"
          - "Facial Recognition"
          - "Security"
          - "Edge Impulse"
        links:
          - icon: fab fa-github
            url: https://github.com/aankitdas/SecureVision

      - title: Sentiment Classification with Custom FFNN and RNN Architectures
        content: Built n-gram language models (unigram & bigram) with Add-k and Kneser-Ney smoothing; evaluated using
                perplexity to measure linguistic predictability. Implemented sentiment analysis models from scratch using Feedforward Neural Networks (FFNN) with bag-of-words
                vectorization and Recurrent Neural Networks (RNN) with word embeddings.
        image: /projects/sentiment.png
        featured:
            name: Report
            link: https://github.com/aankitdas/cs6320_assignment2/blob/main/CS6320_Assignment2.pdf
        badges:
          - "PyTorch"
          - "Language Models"
          - "RNNs"
          - "FFNNs"
          - "NLTK"
          - "Vectorization"
        links:
          - icon: fab fa-github
            url: https://github.com/aankitdas/cs6320_nlp
          - icon: fab fa-github
            url: https://github.com/aankitdas/cs6320_assignment2

      - title: NEAT Algorithm playing Dino Game
        content: Implemented the NeuroEvolution of Augmenting Topologies (NEAT) algorithm to train an AI agent to play the Chrome Dino game. The project involved evolving neural network architectures and weights through genetic algorithms, enabling the agent to learn optimal jumping strategies to avoid obstacles and achieve high scores.
        image: /projects/dino.gif
          
        links:
          - icon: fab fa-github
            url: https://github.com/aankitdas/Local-Dino-Game

      - title: Graph-Based Heuristic Optimization
        content: Modeled a test graph in C++ and applied a heuristic procedure to solve the clique partitioning problem (NP-hard)
                 in dictionary-based test data compression for reducing data volume.
        image: /projects/graph.png
        featured:
          name: Report
          link: https://github.com/aankitdas/clique-partitioning/blob/main/CE6320_project_F24.pdf
        links:
          - icon: fab fa-github
            url: https://github.com/aankitdas/clique-partitioning
