  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: RAISE ADAPT - Novel AI/ML methods to derive CMB temperature and polarization power spectra from uncleaned maps
        content: This project applies novel machine learning methods to extract clean Cosmic Microwave Background (CMB) signals from contaminated data, enabling high-precision studies of primordial gravitational waves. By combining deep neural networks with statistical models and domain knowledge, the team produces scientifically informed, efficient models that directly generate temperature and polarization power spectra from raw maps.
        image: /projects/cmb.jpeg
        # featured:
        #   name: Demo
        #   link: https://github.com/CMB-ML/
        badges:
          - "PyTorch"
          - "Neural Networks"
          - "Cosmology"
        links:
          # - icon: fa fa-envelope
          #   url: mailto:?subject=Hugo%20Profile%20Template&body=Check%20it%20out:%20https%3a%2f%2fhugo-profile.netlify.app%2fblog%2fmarkdown-syntax%2f
