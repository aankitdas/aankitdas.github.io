  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - company: "University of Texas at Dallas"
        companyUrl: "https://physics.utdallas.edu/"
        jobs:
          - name: "Machine Learning Researcher"
            date: "Aug 2025 - present"
            content: |
              Building and optimizing neural pipelines within ADAPT RAISE, an [NSF-funded effort (Award #2327245)](https://www.nsf.gov/awardsearch/showAward?AWD_ID=2327245&HistoricalAwards=false) to accelerate
              cosmological inference using deep learning, focusing on extracting clean power spectra from noisy CMB (Cosmic
              Microwave Background) maps, enabling faster, scalable alternatives to traditional Bayesian pipelines.
            info:
              content: Working as an ML researcher
            featuredItems:
              fontAwesomeIcons:
                - icon: fa-brands fa-github
                  url: https://github.com/CMB-ML/
                  tooltip: CMB-ML GitHub Repo
            
          - name: ""
            # date: "Jan 2022 - Dec 2023"
            content: |
              - Active contributor to the [CMB-ML GitHub organization](https://github.com/CMB-ML/), supporting open-source research for cosmology and machine learning; working toward submitting findings to ICCV/CVPR.
              - Processed 1,600 high-resolution (Nside=512) CMB simulated maps (24GB) across multiple splits.
              - Developed an UNet-inspired encoder-decoder neural architecture, trained under 20 seconds per epoch on modern GPUs, for denoising and recovering the angular power spectrum (Cℓ) across ℓ ∈ [2, 1280] from these simulated maps.
              - Performed rigorous ablation studies including dropout, batch normalization, loss function variants (MSE, normalized MSE, Wishart), and activation functions (ReLU, GELU).
              - Automated hyperparameter sweeps using Hydra and shell scripting to benchmark model performance across ells, detectors, and feature configurations at different resolutions (Nside=128/512).
            

      - company: "SEI Investments Company"
        companyUrl: "https://www.seic.com/"
        jobs:
          - name: "Data Scientist"
            date: "Oct 2021 - Aug 2023"
            info:
              content: Worked as a Data Scientist for 2 years.
            content: |
              Developed end-to-end automation and analytics solutions to streamline data workflows and enhance business intelligence.

              - Automated document processing: Built a Python-based NLP and OCR system that reduced manual data entry by 50% and improved data accessibility.
              - Data reconciliation & insights: Designed a scalable reconciliation workflow in Alteryx and interactive Tableau dashboards for large datasets, improving cross-team efficiency and decision-making.

