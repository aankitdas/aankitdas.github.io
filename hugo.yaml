  # About
  about:
    enable: true
    title: "About Me"
    image: ""
    content: |-
      I’m Aankit, a master's graduate from University of Texas at Dallas, in Computer Engineering. Currently, I am a researcher and engineer passionate about building intelligent systems that help scientists make sense of complex data. My work spans predictive modeling, neural pipelines, and distributed machine learning, with a focus on accelerating cosmological inference from noisy CMB maps.

      I love turning messy datasets into clean, actionable insights, whether through optimizing deep learning architectures, scaling computations across multi-GPU clusters, or experimenting with novel algorithms. Beyond research, I enjoy exploring ways AI can simplify real-world problems, and I’m always tinkering, learning, and pushing the boundaries of what’s possible.

      When I’m not coding or analyzing data, you’ll find me climbing rocks, hiking trails, and capturing landscapes through my lens.
